<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("display.ttf"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #F4EEE2; font-family: "Display", Georgia, serif;
    background:
      radial-gradient(60% 80% at 22% 70%, rgba(242, 201, 138, 0.42), rgba(242, 201, 138, 0) 60%),
      linear-gradient(180deg, #1B3A6B 0%, #0F2447 55%, #081328 100%);
  }
  .grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay;
    background-image: repeating-radial-gradient(circle at 17% 43%, rgba(255,255,255,0.9) 0 0.6px, transparent 0.6px 3px),
                      repeating-radial-gradient(circle at 63% 71%, rgba(255,255,255,0.7) 0 0.5px, transparent 0.5px 2.6px); }
  .star { position: absolute; border-radius: 50%; background: #FFF3D6; }
  svg.mark { position: absolute; left: 92px; top: 74px; width: 352px; height: 352px; }
  .copy { position: absolute; left: 470px; top: 138px; width: 500px; }
  h1 { margin: 0; font-size: 116px; line-height: 1; letter-spacing: -0.02em; font-weight: 700;
       text-shadow: 0 6px 30px rgba(6, 16, 31, 0.5); }
  p { margin: 20px 0 0 4px; font-size: 32px; line-height: 1.25; color: #F2C98A; max-width: 470px; }
  .rule { position: absolute; left: 474px; top: 120px; width: 72px; height: 5px; border-radius: 3px;
          background: linear-gradient(90deg, #FFE3B0, #F0A64E); }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="star" style="left:560px;top:60px;width:4px;height:4px;opacity:.9"></div>
  <div class="star" style="left:860px;top:96px;width:3px;height:3px;opacity:.7"></div>
  <div class="star" style="left:720px;top:42px;width:2px;height:2px;opacity:.6"></div>
  <div class="star" style="left:940px;top:400px;width:3px;height:3px;opacity:.5"></div>
  <div class="star" style="left:40px;top:70px;width:3px;height:3px;opacity:.6"></div>

  <svg class="mark" viewBox="18 18 72 72" aria-hidden="true">
    <defs>
      <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE3B0"/><stop offset="1" stop-color="#F0A64E"/>
      </linearGradient>
      <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5FB3C9"/><stop offset="1" stop-color="#3C7FA8"/>
      </linearGradient>
      <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dy="2.4" result="o"/>
        <feFlood flood-color="#06101F" flood-opacity="0.55"/><feComposite in2="o" operator="in"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108"><feGaussianBlur stdDeviation="3.5"/></filter>
    </defs>
    <path d="M23 50 C33 40 43 40 54 50 S75 60 85 50" fill="none" stroke="#F0A64E" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#halo)"/>
    <path d="M23 50 C33 40 43 40 54 50 S75 60 85 50" fill="none" stroke="url(#amber)" stroke-width="7.5" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M27 66 C36 59 45 59 54 66 S72 73 81 66" fill="none" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M25 49.2 C34 40.4 43 40.4 53 49.4" fill="none" stroke="#FFF7E6" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </svg>

  <div class="rule"></div>
  <div class="copy">
    <h1>Sway</h1>
    <p>Help that arrives in two seconds, and breathes with you.</p>
  </div>
</body>
</html>
