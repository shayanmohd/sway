<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A6B"/>
      <stop offset="0.55" stop-color="#0F2447"/>
      <stop offset="1" stop-color="#081328"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#F2C98A" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#E8A65A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E8A65A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B0"/>
      <stop offset="1" stop-color="#F0A64E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FB3C9"/>
      <stop offset="1" stop-color="#3C7FA8"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="2.4" result="o"/>
      <feFlood flood-color="#06101F" flood-opacity="0.55"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#sky)"/>
    <rect width="108" height="108" fill="url(#glow)"/>
    <circle cx="54" cy="24" r="1.2" fill="#FFF3D6" opacity="0.9"/>
    <circle cx="30" cy="31" r="0.8" fill="#FFF3D6" opacity="0.6"/>
    <circle cx="80" cy="28" r="0.9" fill="#FFF3D6" opacity="0.7"/>
    <circle cx="71" cy="18" r="0.6" fill="#FFF3D6" opacity="0.5"/>
    <circle cx="22" cy="20" r="0.6" fill="#FFF3D6" opacity="0.45"/>
  </g>

  <g id="fg">
    <!-- the breath: one warm wave rising, a cooler one settling beneath it -->
    <path d="M23 50 C33 40 43 40 54 50 S75 60 85 50" fill="none" stroke="#F0A64E" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#halo)"/>
    <path d="M23 50 C33 40 43 40 54 50 S75 60 85 50" fill="none" stroke="url(#amber)" stroke-width="7.5" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M27 66 C36 59 45 59 54 66 S72 73 81 66" fill="none" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.95" filter="url(#soft)"/>
    <path d="M25 49.2 C34 40.4 43 40.4 53 49.4" fill="none" stroke="#FFF7E6" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g id="mono">
    <path d="M23 50 C33 40 43 40 54 50 S75 60 85 50" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M27 66 C36 59 45 59 54 66 S72 73 81 66" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
